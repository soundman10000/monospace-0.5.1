name: monospace

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — system database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: postgres -c 'max_connections=200'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: monospace
      POSTGRES_DB: monospace
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth-host=md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monospace"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - monospace

  # ---------------------------------------------------------------------------
  # RabbitMQ — event bus (required for email delivery & webhooks)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: monospace
      RABBITMQ_DEFAULT_PASS: monospace
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monospace

  # ---------------------------------------------------------------------------
  # Key generator — ephemeral init container that writes JWT + KMS keys once
  # ---------------------------------------------------------------------------
  keygen:
    build:
      context: .
      dockerfile: docker/Dockerfile.keygen
    image: monospace-keygen:local
    restart: "no"
    volumes:
      - ./keys:/keys

  # ---------------------------------------------------------------------------
  # Benefits catalog.
  # ---------------------------------------------------------------------------
  benefits-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    image: monospace-migrate:v0.5.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:monospace@postgres:5432/benefits"
      ADMIN_DATABASE_URL: "postgres://postgres:monospace@postgres:5432/postgres"
    volumes:
      - ./benefits-app/migrations:/opt/benefits-app/migrations:ro
    networks:
      - monospace

  # ---------------------------------------------------------------------------
  # Monospace
  # ---------------------------------------------------------------------------
  monospace:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MONOSPACE_VERSION: v0.5.1
    image: monospace:v0.5.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
      benefits-migrate:
        condition: service_completed_successfully
    ports:
      - "8100:8100"
    volumes:
      - ./keys:/keys:ro
      - uploads_data:/uploads
    environment:
      # Server
      MONOSPACE_HOST: "0.0.0.0"
      MONOSPACE_PORT: "8100"
      MONOSPACE_BASE_URL: "http://localhost:8100"
      # System database (container port 5432; host is bound to 5434)
      MONOSPACE_SYSTEM_DATABASE__PROVIDER: "postgres"
      MONOSPACE_SYSTEM_DATABASE__HOST: "postgres"
      MONOSPACE_SYSTEM_DATABASE__PORT: "5432"
      MONOSPACE_SYSTEM_DATABASE__USER: "postgres"
      MONOSPACE_SYSTEM_DATABASE__PASSWORD: "monospace"
      MONOSPACE_SYSTEM_DATABASE__DBNAME: "monospace"
      # File storage (local, inside the container)
      MONOSPACE_SYSTEM_FILE_STORAGE__PROVIDER: "local"
      MONOSPACE_SYSTEM_FILE_STORAGE__ROOT_PATH: "/uploads"
      # RabbitMQ
      MONOSPACE_RABBITMQ__HOST: "rabbitmq"
      MONOSPACE_RABBITMQ__PORT: "5672"
      MONOSPACE_RABBITMQ__USER: "monospace"
      MONOSPACE_RABBITMQ__PASSWORD: "monospace"
      MONOSPACE_RABBITMQ__VHOST: "/"
      # JWT keys (generated by keygen init container)
      MONOSPACE_JWT_PRIVATE_KEY__FILE: "/keys/jwt_private.pem"
      MONOSPACE_JWT_PUBLIC_KEY__FILE: "/keys/jwt_public.pem"
      # KMS (generated by keygen init container)
      MONOSPACE_KMS__TYPE: "monospace"
      MONOSPACE_KMS__MASTER_KEY__FILE: "/keys/kms_master.key"
      # Auth tokens
      MONOSPACE_ACCESS_TOKEN_TTL: "15m"
      MONOSPACE_REFRESH_TOKEN_TTL: "7days"
      # Cookie — disable Secure flag so HTTP works out of the box
      MONOSPACE_COOKIE_SECURE: "false"
    networks:
      - monospace

  # Default entrypoint: workspace, org branding, benefits source, Directus source.
  # Extra workspaces/sources:
  #   docker compose run --rm --no-deps monospace-init workspace --workspace acme --workspace-name Acme
  #   docker compose run --rm --no-deps monospace-init source --workspace acme --source acme-db --dbname acme
  # AI settings are per workspace; the provider key in env is shared and applied on create.
  # Monospace API keys are org-level (user-scoped), not per workspace.
  monospace-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.cli
    image: monospace-cli:local
    restart: "no"
    env_file:
      - init.env
    depends_on:
      monospace:
        condition: service_started
      benefits-migrate:
        condition: service_completed_successfully
      directus:
        condition: service_healthy
    environment:
      MONOSPACE_URL: "http://monospace:8100"
      MONOSPACE_API_KEY: ${MONOSPACE_API_KEY:-}
      MONOSPACE_BOOTSTRAP_EMAIL: ${MONOSPACE_BOOTSTRAP_EMAIL:-admin@benefitsgo.tech}
      MONOSPACE_BOOTSTRAP_PASSWORD: ${MONOSPACE_BOOTSTRAP_PASSWORD:-Empyrean1}
      MONOSPACE_BOOTSTRAP_NAME: ${MONOSPACE_BOOTSTRAP_NAME:-Admin}
      MONOSPACE_AI_PROVIDER: ${MONOSPACE_AI_PROVIDER:-openai}
      MONOSPACE_AI_API_KEY: ${MONOSPACE_AI_API_KEY:-}
      MONOSPACE_AI_CHAT_MODEL: ${MONOSPACE_AI_CHAT_MODEL:-gpt-5.4}
      MONOSPACE_AI_FAST_MODEL: ${MONOSPACE_AI_FAST_MODEL:-o4-mini}
      MONOSPACE_AI_REASONING: ${MONOSPACE_AI_REASONING:-true}
      MONOSPACE_AI_REASONING_LEVEL: ${MONOSPACE_AI_REASONING_LEVEL:-medium}
      MONOSPACE_SOURCE_PASSWORD: ${MONOSPACE_SOURCE_PASSWORD:-monospace}
    networks:
      - monospace

  # ---------------------------------------------------------------------------
  # Directus — create the database, then start the CMS
  # ---------------------------------------------------------------------------
  directus-init:
    image: postgres:17
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: monospace
      DIRECTUS_DB: directus
    volumes:
      - ./directus/ensure-database.sh:/ensure-database.sh:ro
    entrypoint: ["/bin/sh", "/ensure-database.sh"]
    networks:
      - monospace

  directus:
    build:
      context: .
      dockerfile: docker/Dockerfile.directus
      args:
        DIRECTUS_VERSION: "11"
    image: directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      directus-init:
        condition: service_completed_successfully
    ports:
      - "8055:8055"
    volumes:
      - ./directus/migrations:/directus/migrations
      - ./directus/certs:/directus/certs:ro
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    environment:
      MIGRATIONS_PATH: "/directus/migrations"
      NODE_EXTRA_CA_CERTS: "/directus/certs/netskope-ca.pem"
      SECRET: "local-directus-dev-secret-do-not-use"
      DIRECTUS_AI_XAI_API_KEY: ${DIRECTUS_AI_XAI_API_KEY:-}
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "postgres"
      DB_PASSWORD: "monospace"
      ADMIN_EMAIL: "admin@benefitsgo.tech"
      ADMIN_PASSWORD: "Empyrean1"
      PUBLIC_URL: "http://localhost:8055"
      WEBSOCKETS_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - monospace

  # ---------------------------------------------------------------------------
  # App — Nuxt website (TypeScript + Tailwind)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: monospace-app:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NUXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - monospace

volumes:
  postgres_data:
  rabbitmq_data:
  uploads_data:
  directus_uploads:
  directus_extensions:
  app_node_modules:

networks:
  monospace:
